<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <meta name="theme-color" content="#2d6a4f">
  <title>ختمة القرآن الكريم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-controls">
    <button class="icon-btn" id="darkModeBtn" onclick="toggleDarkMode()" title="تبديل المظهر">
      <!-- moon icon -->
      <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <a class="icon-btn" href="admin.html" title="لوحة الأدمن">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
    </a>
  </div>
  <div class="header-basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  <div class="header-title">📖 ختمة القرآن الكريم</div>
  <div class="header-subtitle">متابعة أجزاء الأعضاء الثلاثين</div>
</header>

<main class="container">

  <!-- معلومات الأسبوع -->
  <div id="weekBanner" class="week-banner">
    <div class="week-info">
      <span class="week-label">📅 جارٍ التحميل...</span>
    </div>
  </div>

  <!-- شريط التقدم -->
  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-label">📊 تقدم القراءة</span>
      <span class="progress-count" id="progressCount">٠ من ٣٠</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- بحث -->
  <div class="search-wrap no-print">
    <span class="search-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input type="text" id="searchInput" class="search-input"
      placeholder="ابحث عن اسم عضو..." oninput="onSearch()" autocomplete="off">
  </div>

  <!-- العمودان -->
  <div id="membersColumns" class="members-columns">
    <!-- العمود الأيمن: 1-15 -->
    <div class="members-col" id="colRight"></div>
    <!-- العمود الأيسر: 16-30 -->
    <div class="members-col" id="colLeft"></div>
  </div>

  <!-- Loading state -->
  <div id="loadingState" class="state-msg">
    <div class="spinner"></div>
    جارٍ تحميل البيانات...
  </div>

  <hr class="divider no-print">
  <div class="admin-hint no-print">
    🔒 <a href="admin.html">الدخول للوحة الأدمن</a>
  </div>

</main>

<!-- Footer -->
<footer class="site-footer-credit">
  Made with <span class="heart">♥</span> by <a href="https://aboodalobada.space" target="_blank" rel="noopener">Abdel Rahman Al-Obadah</a>
</footer>

<!-- Toast -->
<div id="toastEl" class="toast"></div>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
